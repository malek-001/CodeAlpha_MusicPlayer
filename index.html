<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeAlpha Music Player</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="player">
      <h2>CodeAlpha Music Player</h2>
      <div class="img-box">
        <img id="cover" src="https://picsum.photos/300/300?random=1" />
      </div>
      <h3 id="title">Song Title</h3>
      <p id="artist">Artist</p>
      <audio id="audio"></audio>
      <input type="range" id="progress" value="0" />
      <div class="time">
        <span id="curr">0:00</span><span id="dur">0:00</span>
      </div>
      <div class="controls">
        <button id="prev">⏮</button>
        <button id="play">▶</button>
        <button id="next">⏭</button>
      </div>
      <div class="volume-box">
        🔊
        <input
          type="range"
          id="volume"
          min="0"
          max="1"
          step="0.01"
          value="0.7"
        />
      </div>
      <label><input type="checkbox" id="autoplay" checked /> Autoplay</label>
      <ul id="playlist"></ul>
    </div>
    <script src="script.js"></script>
  </body>
</html>
